<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — GlowLog</title>
    <link rel="stylesheet" th:href="@{/css/login.css}" />
</head>
<body>
<div class="auth-box">
    <div class="brand-section">
        <div class="brand-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12c0 1.66 1.34 3 3 3h1.5c.83 0 1.5.67 1.5 1.5v1.5c0 1.66 1.34 3 3 3 5.5 0 10-4.5 10-10S17.5 2 12 2zm5.5 11c-.83 0-1.5-.67-1.5-1.5S16.67 10 17.5 10s1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm-3-4C13.67 9 13 8.33 13 7.5S13.67 6 14.5 6s1.5.67 1.5 1.5S15.33 9 14.5 9zM10 6c-.83 0-1.5.67-1.5 1.5S9.17 9 10 9s1.5-.67 1.5-1.5S10.83 6 10 6zm-3.5 5c-.83 0-1.5.67-1.5 1.5S5.67 14 6.5 14 8 13.33 8 12.5 7.33 11 6.5 11z"/></svg>
        </div>
        <div class="brand"><span class="brand-accent">Glow</span>Log</div>
        <div class="ornament">✿ ─ ✿ ─ ✿</div>
        <div class="subtitle">Welcome back to your skincare shelf.</div>
    </div>

    <div th:if="${param.error}" class="alert alert-danger">Invalid username or password.</div>
    <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <form th:action="@{/auth/login}" method="post">
        <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input id="username" class="form-control" type="text" name="username" autocomplete="username" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input id="password" class="form-control" type="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-submit">Get That Glow</button>
    </form>

    <div class="footer-link">First time here? <a th:href="@{/auth/register}">Register</a></div>
</div>
</body>
</html>
