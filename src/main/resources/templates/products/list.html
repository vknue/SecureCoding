<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shelf — GlowLog</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #fef4ec; --surface: #ffffff; --surface-2: #faeadd;
            --border: #f3d6c1; --accent: #f48fb1; --accent-hover: #e57aa0;
            --accent-soft: #f9c3d3; --sage: #a5b88f; --sage-soft: #c7d6b2;
            --gold: #d4a574; --gold-soft: #f0d8b8;
            --ink: #4a3a3a; --text-muted: #968383;
            --success: #7faa61; --danger: #d96363; --info: #6ba8c4;
            --am: #f9c3d3; --pm: #b09cc6;
        }
        body { background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
        a { color: var(--accent); text-decoration: none; }

        .navbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 64px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(244,143,177,0.05); }
        .navbar-brand { display: flex; align-items: center; gap: 0.7rem; font-size: 1.4rem; font-weight: 800; color: var(--ink); letter-spacing: -0.5px; }
        .navbar-brand .accent { color: var(--accent); }
        .brand-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(244,143,177,0.3); }
        .brand-icon svg { width: 22px; height: 22px; fill: var(--surface); }
        .navbar-nav { display: flex; align-items: center; gap: 1.5rem; list-style: none; }
        .navbar-nav a { color: var(--text-muted); font-size: 0.9rem; font-weight: 600; }
        .navbar-nav a:hover { color: var(--accent); }
        .user-badge { background: var(--surface-2); border: 1px solid var(--border); border-radius: 20px; padding: 0.25rem 0.85rem; font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }

        .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.55rem 1.1rem; border-radius: 10px; border: 1px solid transparent; font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: all 0.15s; text-decoration: none; }
        .btn-primary { background: var(--accent); color: var(--surface); }
        .btn-primary:hover { background: var(--accent-hover); color: var(--surface); }
        .btn-outline { background: transparent; color: var(--ink); border-color: var(--border); }
        .btn-outline:hover { background: var(--surface-2); border-color: var(--accent); color: var(--accent); }
        .btn-sm { padding: 0.32rem 0.8rem; font-size: 0.78rem; }
        .btn-danger-sm { background: transparent; color: var(--danger); border: 1px solid var(--danger); border-radius: 10px; padding: 0.32rem 0.8rem; font-size: 0.78rem; font-weight: 700; cursor: pointer; }
        .btn-danger-sm:hover { background: var(--danger); color: var(--surface); }

        .main { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }
        .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.75rem; }
        .page-title { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.5px; }
        .page-title .accent { color: var(--accent); }

        .search-bar { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.1rem 1.3rem; margin-bottom: 1.5rem; display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: flex-end; box-shadow: 0 4px 12px rgba(244,143,177,0.06); }
        .sg { display: flex; flex-direction: column; gap: 0.35rem; flex: 1; min-width: 140px; }
        .sg label { font-size: 0.7rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; }
        .form-control, .form-select { background: var(--surface-2); border: 1.5px solid var(--border); color: var(--ink); padding: 0.55rem 0.9rem; border-radius: 10px; font-size: 0.9rem; appearance: none; width: 100%; transition: all 0.2s; }
        .form-control:focus, .form-select:focus { outline: none; border-color: var(--accent); background: var(--surface); }
        .form-control::placeholder { color: #c8a8a8; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.25rem; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; transition: all 0.25s; display: flex; flex-direction: column; position: relative; box-shadow: 0 2px 6px rgba(244,143,177,0.05); }
        .card:hover { transform: translateY(-4px); box-shadow: 0 16px 36px rgba(244,143,177,0.18); border-color: var(--accent-soft); }
        .card.holy-grail { border: 2px solid var(--gold); }
        .card.holy-grail::before { content: ''; position: absolute; inset: -1px; background: linear-gradient(135deg, var(--gold) 0%, var(--accent) 100%); border-radius: 16px; z-index: -1; opacity: 0.15; }

        .status-stripe { height: 4px; }
        .status-stripe.active        { background: linear-gradient(90deg, var(--sage) 0%, var(--sage-soft) 100%); }
        .status-stripe.finished      { background: var(--text-muted); }
        .status-stripe.abandoned     { background: var(--danger); opacity: 0.5; }
        .status-stripe.want_to_try   { background: var(--info); }
        .status-stripe.repurchase    { background: linear-gradient(90deg, var(--gold) 0%, var(--accent) 100%); }

        .crown-badge { position: absolute; top: -10px; right: 18px; background: linear-gradient(135deg, var(--gold) 0%, #e8b988 100%); color: var(--surface); padding: 0.35rem 0.7rem; border-radius: 999px; font-size: 0.68rem; font-weight: 900; letter-spacing: 0.8px; text-transform: uppercase; box-shadow: 0 4px 12px rgba(212,165,116,0.4); display: flex; align-items: center; gap: 0.3rem; z-index: 1; }

        .card-header { padding: 1.25rem 1.25rem 0.6rem; }
        .brand-line { font-size: 0.72rem; font-weight: 800; color: var(--accent); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 0.25rem; }
        .product-name { font-size: 1.1rem; font-weight: 700; color: var(--ink); letter-spacing: -0.3px; line-height: 1.3; }
        .product-name a { color: var(--ink); }
        .product-name a:hover { color: var(--accent); }

        .card-body { padding: 0.5rem 1.25rem 1rem; flex: 1; display: flex; flex-direction: column; gap: 0.65rem; }

        .badges-row { display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .badge { display: inline-block; padding: 0.22rem 0.65rem; border-radius: 999px; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; }
        .badge-category { background: rgba(244,143,177,0.12); color: var(--accent); border: 1px solid rgba(244,143,177,0.3); }
        .badge-status-active        { background: rgba(127,170,97,0.12); color: var(--success); border: 1px solid rgba(127,170,97,0.3); }
        .badge-status-finished      { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }
        .badge-status-abandoned     { background: rgba(217,99,99,0.08); color: var(--danger); border: 1px solid rgba(217,99,99,0.25); }
        .badge-status-want_to_try   { background: rgba(107,168,196,0.12); color: var(--info); border: 1px solid rgba(107,168,196,0.3); }
        .badge-status-repurchase    { background: linear-gradient(135deg, rgba(212,165,116,0.15) 0%, rgba(244,143,177,0.12) 100%); color: var(--gold); border: 1px solid var(--gold-soft); }

        .routine-pill { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.22rem 0.6rem; border-radius: 999px; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.4px; text-transform: uppercase; }
        .routine-pill.am_only      { background: rgba(249,195,211,0.3); color: var(--accent); border: 1px solid var(--accent-soft); }
        .routine-pill.pm_only      { background: rgba(176,156,198,0.2); color: var(--pm); border: 1px solid rgba(176,156,198,0.4); }
        .routine-pill.am_and_pm    { background: linear-gradient(90deg, rgba(249,195,211,0.3) 0%, rgba(176,156,198,0.2) 100%); color: var(--ink); border: 1px solid var(--border); }
        .routine-pill.weekly       { background: rgba(212,165,116,0.15); color: var(--gold); border: 1px solid var(--gold-soft); }
        .routine-pill.as_needed    { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }

        .stars-row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
        .stars { display: inline-flex; gap: 0.1rem; font-size: 0.95rem; }
        .star-filled { color: var(--gold); }
        .star-empty { color: var(--border); }
        .empty-count-pill { background: var(--surface-2); color: var(--text-muted); padding: 0.18rem 0.6rem; border-radius: 999px; font-size: 0.7rem; font-weight: 700; border: 1px solid var(--border); display: inline-flex; align-items: center; gap: 0.25rem; }
        .empty-count-pill strong { color: var(--accent); font-weight: 800; }

        .quality-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.45rem; }
        .quality-row { display: flex; align-items: center; gap: 0.4rem; font-size: 0.72rem; }
        .quality-label { color: var(--text-muted); font-weight: 700; min-width: 56px; text-transform: uppercase; letter-spacing: 0.3px; font-size: 0.66rem; }
        .quality-bar { flex: 1; height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
        .quality-fill { height: 100%; background: linear-gradient(90deg, var(--accent-soft) 0%, var(--accent) 100%); border-radius: 3px; }
        .quality-value { font-weight: 800; color: var(--ink); font-size: 0.7rem; min-width: 22px; text-align: right; }

        .meta-row { display: flex; gap: 0.85rem; font-size: 0.75rem; padding-top: 0.4rem; flex-wrap: wrap; }
        .meta-item { display: flex; align-items: center; gap: 0.3rem; color: var(--text-muted); font-weight: 600; }
        .meta-item strong { color: var(--ink); font-weight: 800; }

        .mood-line { font-size: 0.78rem; color: var(--text-muted); font-style: italic; padding: 0.45rem 0.7rem; background: var(--surface-2); border-left: 3px solid var(--accent-soft); border-radius: 0 8px 8px 0; }

        .card-footer { display: flex; gap: 0.5rem; padding: 0.7rem 1.25rem; border-top: 1px solid var(--border); background: var(--surface-2); }

        .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
        .empty-state h3 { color: var(--ink); font-size: 1.2rem; margin-bottom: 0.5rem; }
        .alert-success { padding: 0.85rem 1rem; border-radius: 10px; margin-bottom: 1.25rem; font-size: 0.9rem; background: rgba(127,170,97,0.08); border: 1px solid rgba(127,170,97,0.25); color: var(--success); font-weight: 600; }
    </style>
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/products}">
        <span class="brand-icon"><svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12c0 1.66 1.34 3 3 3h1.5c.83 0 1.5.67 1.5 1.5v1.5c0 1.66 1.34 3 3 3 5.5 0 10-4.5 10-10S17.5 2 12 2z"/></svg></span>
        <span><span class="accent">Glow</span>Log</span>
    </a>
    <ul class="navbar-nav">
        <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/products/new}">+ Add Product</a></li>
        <li><a href="/swagger-ui.html" target="_blank">API</a></li>
        <li><span class="user-badge" sec:authentication="name">user</span></li>
        <li>
            <form th:action="@{/auth/logout}" method="post" style="display:inline">
                <button type="submit" class="btn btn-outline btn-sm">Logout</button>
            </form>
        </li>
    </ul>
</nav>

<div class="main">
    <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>

    <div class="page-header">
        <h1 class="page-title">My <span class="accent">Shelf</span></h1>
        <span class="user-badge" th:text="${products.size()} + ' products'"></span>
    </div>

    <form class="search-bar" th:action="@{/products}" method="get">
        <div class="sg" style="flex:2; min-width:200px;">
            <label>Name / Brand / Ingredient</label>
            <input class="form-control" type="text" name="query" th:value="${query}" placeholder="e.g. niacinamide, CeraVe, retinol...">
        </div>
        <div class="sg">
            <label>Category</label>
            <select class="form-select" name="category">
                <option value="">All categories</option>
                <option th:each="c : ${categories}" th:value="${c}"
                        th:text="${#strings.replace(c.name(),'_',' ')}"
                        th:selected="${selectedCategory == c}"></option>
            </select>
        </div>
        <div class="sg">
            <label>Skin Type</label>
            <select class="form-select" name="skinType">
                <option value="">All types</option>
                <option th:each="t : ${skinTypes}" th:value="${t}"
                        th:text="${#strings.replace(t.name(),'_',' ')}"
                        th:selected="${selectedSkinType == t}"></option>
            </select>
        </div>
        <div class="sg">
            <label>Status</label>
            <select class="form-select" name="status">
                <option value="">All statuses</option>
                <option th:each="s : ${statuses}" th:value="${s}"
                        th:text="${#strings.replace(s.name(),'_',' ')}"
                        th:selected="${selectedStatus == s}"></option>
            </select>
        </div>
        <div style="display:flex; gap:0.5rem; align-items:flex-end;">
            <button type="submit" class="btn btn-primary">Search</button>
            <a th:href="@{/products}" class="btn btn-outline">Clear</a>
        </div>
    </form>

    <div th:if="${products.isEmpty()}" class="empty-state">
        <h3>No products yet</h3>
        <p>Add your first product to start building your shelf.</p>
    </div>

    <div class="grid" th:unless="${products.isEmpty()}">
        <div class="card" th:each="product : ${products}" th:classappend="${product.holyGrail} ? 'holy-grail' : ''">
            <div class="status-stripe" th:classappend="${#strings.toLowerCase(product.status.name())}"></div>

            <span class="crown-badge" th:if="${product.holyGrail}">♛ Holy Grail</span>

            <div class="card-header">
                <div class="brand-line" th:text="${product.brand}"></div>
                <div class="product-name">
                    <a th:href="@{/products/{id}(id=${product.id})}" th:text="${product.name}"></a>
                </div>
            </div>

            <div class="card-body">
                <div class="badges-row">
                    <span class="badge"
                          th:classappend="'badge-status-' + ${#strings.toLowerCase(product.status.name())}"
                          th:text="${#strings.replace(product.status.name(),'_',' ')}"></span>
                    <span class="badge badge-category"
                          th:text="${#strings.replace(product.category.name(),'_',' ')}"></span>
                    <span class="routine-pill" th:classappend="${#strings.toLowerCase(product.routineSlot.name())}"
                          th:text="${#strings.replace(product.routineSlot.name(),'_',' ')}"></span>
                </div>

                <div class="stars-row">
                    <div class="stars" th:if="${product.rating != null}">
                        <span th:each="i : ${#numbers.sequence(1,5)}"
                              th:classappend="${i <= product.rating} ? 'star-filled' : 'star-empty'"
                              th:text="${i <= product.rating} ? '★' : '☆'"></span>
                    </div>
                    <span class="empty-count-pill" th:if="${product.emptyCount != null and product.emptyCount > 1}">
                        ♻ Empty #<strong th:text="${product.emptyCount}"></strong>
                    </span>
                </div>

                <div class="quality-grid"
                     th:if="${product.effectivenessScore != null or product.textureScore != null or product.scentScore != null or product.valueScore != null}">
                    <div class="quality-row" th:if="${product.effectivenessScore != null}">
                        <span class="quality-label">✨ Works</span>
                        <div class="quality-bar">
                            <div class="quality-fill" th:style="'width:' + (${product.effectivenessScore} * 10) + '%'"></div>
                        </div>
                        <span class="quality-value" th:text="${product.effectivenessScore}"></span>
                    </div>
                    <div class="quality-row" th:if="${product.textureScore != null}">
                        <span class="quality-label">💧 Feel</span>
                        <div class="quality-bar">
                            <div class="quality-fill" th:style="'width:' + (${product.textureScore} * 10) + '%'"></div>
                        </div>
                        <span class="quality-value" th:text="${product.textureScore}"></span>
                    </div>
                    <div class="quality-row" th:if="${product.scentScore != null}">
                        <span class="quality-label">🌸 Scent</span>
                        <div class="quality-bar">
                            <div class="quality-fill" th:style="'width:' + (${product.scentScore} * 10) + '%'"></div>
                        </div>
                        <span class="quality-value" th:text="${product.scentScore}"></span>
                    </div>
                    <div class="quality-row" th:if="${product.valueScore != null}">
                        <span class="quality-label">💰 Value</span>
                        <div class="quality-bar">
                            <div class="quality-fill" th:style="'width:' + (${product.valueScore} * 10) + '%'"></div>
                        </div>
                        <span class="quality-value" th:text="${product.valueScore}"></span>
                    </div>
                </div>

                <div class="meta-row">
                    <span class="meta-item" th:if="${product.volumeMl != null}">
                        💧 <strong th:text="${product.volumeMl} + 'ml'"></strong>
                    </span>
                    <span class="meta-item" th:if="${product.priceEur != null}">
                        💸 <strong th:text="'€' + ${product.priceEur}"></strong>
                    </span>
                    <span class="meta-item" th:if="${product.pao != null and !product.pao.isBlank()}">
                        ⏱ <strong th:text="${product.pao}"></strong>
                    </span>
                </div>

                <div class="mood-line" th:if="${product.moodTags != null and !product.moodTags.isBlank()}"
                     th:text="${product.moodTags}"></div>
            </div>

            <div class="card-footer" sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-outline btn-sm">Edit</a>
                <form th:action="@{/products/delete/{id}(id=${product.id})}" method="post"
                      onsubmit="return confirm('Remove this product?')">
                    <button type="submit" class="btn-danger-sm">Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
